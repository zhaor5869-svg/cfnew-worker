# cfnew 家宽订阅：CF 节点带路，落地是住宅宽带
# 内核要 1.19.25 以上，老内核不认这类节点
# 节点是网友共享的，掉线很正常，家宽自动会自己往下换
# 生成时间 2026-11-21 19:32 CST，节点有效期以 VPN Gate 清单为准
# 移动版：前置为移动优选 IP + 香港优选 IP + 21 个优选域名 + 2 个直连 pages.dev，测速组在移动流量下自动选最快的前置；家宽节点来自公开 VPN Gate 清单；实测连通 60/69 个节点（TCP 握手，2026-11-21 19:32 CST）
