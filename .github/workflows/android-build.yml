# Build LaoDa Proxy debug APK on GitHub Actions.
# 本机 Gradle 构建被出口代理挡住（JDK TLS 与代理 MITM 不兼容），
# 所以 APK 在 GitHub Actions 的 runner 上编译（正常联网）。
# 触发：push 到 main（android/ 有变化）或手动 workflow_dispatch。
# 注意：仓库只含文本源码。二进制依赖在构建时下载：
# - Mihomo 核心 AAR 由 Gradle 任务 downloadMihomo 从 GitHub Releases 拉取并校验 SHA-256。
# - Geo 数据库（Country.mmdb / geoip.dat / geosite.dat）由下面步骤从
#   MetaCubeX/meta-rules-dat 的 latest release 拉取到 android/app/src/main/assets/。
name: Android APK

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle 8.7
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.7'

      - name: Download geo databases
        run: |
          mkdir -p android/app/src/main/assets
          curl -sL -o android/app/src/main/assets/Country.mmdb "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/country.mmdb"
          curl -sL -o android/app/src/main/assets/geoip.dat "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip.dat"
          curl -sL -o android/app/src/main/assets/geosite.dat "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
          ls -la android/app/src/main/assets/

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: laoda-proxy-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
